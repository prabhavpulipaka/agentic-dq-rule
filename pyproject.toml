[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dq-rule-author"
version = "0.1.0"
description = "Agentic data quality rule author for Databricks"
requires-python = ">=3.10,<3.13"

dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "pytest>=8.0,<9",
    "pyspark>=3.5,<4",
    "mcp>=1.0,<2",
    "databricks-sdk>=0.40,<1",
    "databricks-sql-connector>=3.0,<5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]